<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 · Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #111;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  canvas {
    background: #000;
    border: 3px solid #444;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(0, 255, 120, 0.15);
    max-width: 96vw;
    max-height: 80vh;
  }
  #hud {
    width: 624px;
    max-width: 96vw;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #9f9;
    text-shadow: 0 0 6px rgba(0,255,120,.5);
  }
  #hud b { color: #fff; }
  #tip {
    font-size: 12px;
    color: #888;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    background: #333; border: 1px solid #555; border-radius: 3px;
    padding: 0 5px; font-size: 11px; color: #ccc;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>分数 <b id="score">0</b></span>
    <span>关卡 <b id="level">1</b></span>
    <span>生命 <b id="lives">3</b></span>
    <span>敌人 <b id="enemies">0</b></span>
  </div>
  <canvas id="game" width="624" height="624"></canvas>
  <div id="tip">
    <kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 移动 &nbsp;·&nbsp; <kbd>空格</kbd> / <kbd>J</kbd> 开火 &nbsp;·&nbsp; <kbd>P</kbd> 暂停 &nbsp;·&nbsp; <kbd>R</kbd> 重新开始<br>
    消灭所有敌方坦克，保卫你的基地（★）！
  </div>
</div>

<script>
(() => {
"use strict";

// ==================== 基本配置 ====================
const GRID = 26;              // 每格像素
const COLS = 24, ROWS = 24;   // 网格数
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const ui = {
  score: document.getElementById("score"),
  level: document.getElementById("level"),
  lives: document.getElementById("lives"),
  enemies: document.getElementById("enemies"),
};

// 地形类型
const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, FOREST = 4, BASE = 5;

// 每个大格拆成 2x2 小格，子弹可以打掉半块砖
const SUB = COLS * 2;
const map = new Array(SUB * SUB).fill(EMPTY);

function cellAt(cx, cy) {
  if (cx < 0 || cy < 0 || cx >= SUB || cy >= SUB) return STEEL; // 边界外视为钢墙
  return map[cy * SUB + cx];
}
function setCell(cx, cy, v) {
  if (cx < 0 || cy < 0 || cx >= SUB || cy >= SUB) return;
  map[cy * SUB + cx] = v;
}

// ==================== 关卡地图 ====================
// 每关用 24x24 的大格布局，B=砖 S=钢 W=水 F=树林 .=空 基地自动生成
const LEVELS = [
  [
    "........................",
    "........................",
    "..BB..BB..BB..BB..BB....",
    "..BB..BB..BB..BB..BB....",
    "..BB..BB..BB..BB..BB....",
    "..BB..BB..BB..BB..BB....",
    "..BB..BB..BBSSBB..BB....",
    "..............SS........",
    "SSBB..BB..BB..SS..BB..SS",
    "....WW..................",
    "....WW..BB..BB..BB..BB..",
    "........BB..BB..BB..BB..",
    "..BB..BB..BB..BB..BB....",
    "..BB..BB..BB..BB..BB....",
    "........................",
    "SS..BB..FF..FF..BB..SS..",
    "....BB..FF..FF..BB......",
    "..BB....FF..FF....BB....",
    "........................",
    "..BB..BBSSSSSS..BB..BB..",
    "..BB..BB......SSBB..BB..",
    "........................",
    "........................",
    "........................",
  ],
  [
    "........................",
    "SSSS........SSSS........",
    "....BB..........BB......",
    "..BBBBBB....BBBBBB......",
    "..BFFFFB....BFFFFB......",
    "..BFFFFB....BFFFFB..SS..",
    "..BBBBBB....BBBBBB......",
    "........................",
    "....WWWW....WWWW........",
    "....WWWW....WWWW....BB..",
    "SS..................BB..",
    "........SSSS........BB..",
    "..BB....SSSS........BB..",
    "..BB................BB..",
    "........................",
    "..BBBB..BBBB..BBBB..SS..",
    "..B..B..B..B..B..B......",
    "..B..B..B..B..B..B..BB..",
    "..BBBB..BBBB..BBBB......",
    "........................",
    "....SS....BB..BB....SS..",
    "..........BB..BB........",
    "........................",
    "........................",
  ],
  [
    "........................",
    "...BB..SS....SS..BB.....",
    "...BB..SS....SS..BB.....",
    "...BB............BB.....",
    "........................",
    "FFF..BBBB....BBBB..FFF..",
    "FFF..B..B....B..B..FFF..",
    ".....BBBB....BBBB.......",
    "........................",
    "..SS..WWWWWWWWWW..SS....",
    "......W........W........",
    "......W.BB..BB.W........",
    "......W.BB..BB.W........",
    "......W........W........",
    "..SS..WWWWWWWWWW..SS....",
    "........................",
    "..BBB....SSSS....BBB....",
    "..B.B....SSSS....B.B....",
    "..BBB............BBB....",
    "........................",
    "....BB..BB..BB..BB......",
    "....BB..BB..BB..BB......",
    "........................",
    "........................",
  ],
];

function buildLevel(n) {
  map.fill(EMPTY);
  const layout = LEVELS[(n - 1) % LEVELS.length];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = layout[y][x];
      let t = EMPTY;
      if (ch === "B") t = BRICK;
      else if (ch === "S") t = STEEL;
      else if (ch === "W") t = WATER;
      else if (ch === "F") t = FOREST;
      if (t !== EMPTY) {
        setCell(x * 2, y * 2, t);
        setCell(x * 2 + 1, y * 2, t);
        setCell(x * 2, y * 2 + 1, t);
        setCell(x * 2 + 1, y * 2 + 1, t);
      }
    }
  }
  // 基地（右下角），周围砖墙保护
  const bx = COLS - 3, by = ROWS - 3;
  for (let i = 0; i < 2; i++) {
    setCell((bx + i) * 2, (by) * 2, BRICK);
    setCell((bx + i) * 2 + 1, (by) * 2, BRICK);
    setCell((bx + i) * 2, (by + 1) * 2 + 1, BRICK);
    setCell((bx + i) * 2 + 1, (by + 1) * 2 + 1, BRICK);
    setCell((bx) * 2 + 1, (by + i) * 2, BRICK);
    setCell((bx) * 2 + 1, (by + i) * 2 + 1, BRICK);
  }
  for (let sy = by * 2; sy < by * 2 + 2; sy++)
    for (let sx = (bx + 1) * 2; sx < (bx + 1) * 2 + 2; sx++)
      setCell(sx, sy, BASE);
}

// ==================== 音效（WebAudio 合成，无需资源文件） ====================
let audioCtx = null;
function beep(freq, dur, type = "square", vol = 0.08, slide = 0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 忽略音频错误 */ }
}
const sfx = {
  shoot:  () => beep(880, 0.08, "square", 0.05, -400),
  boom:   () => { beep(120, 0.3, "sawtooth", 0.12, -80); beep(60, 0.4, "triangle", 0.1, -30); },
  hitWall:() => beep(200, 0.06, "square", 0.04, -100),
  steel:  () => beep(1200, 0.05, "square", 0.04),
  bonus:  () => { beep(660, 0.1); setTimeout(() => beep(990, 0.15), 100); },
  start:  () => { [440, 550, 660, 880].forEach((f, i) => setTimeout(() => beep(f, 0.12, "square", 0.06), i * 120)); },
};

// ==================== 游戏状态 ====================
let state = "menu"; // menu | play | over | win
let score = 0, lives = 3, level = 1;
let enemiesToSpawn = 0, enemiesAlive = 0, spawnTimer = 0, totalEnemies = 0;
let paused = false;
let frame = 0;

const player = { x: 0, y: 0, dir: 0, speed: 1.6, alive: true, cooldown: 0, shield: 120, respawnInvuln: 0 };
const ENEMY_SPEED = 0.9, ENEMY_SHOOT_INTERVAL = 90;
let enemies = [];   // {x,y,dir,cool,hp,type,moveTimer,freeze}
let bullets = [];   // {x,y,dx,dy,owner,power}
let effects = [];   // {x,y,t,type}
let powerups = [];  // {x,y,type,t}
let stars = [];     // 菜单背景装饰

const DIRS = [[0,-1],[0,1],[-1,0],[1,0]]; // 上右下左
const SIZE = GRID * 2 - 4; // 坦克碰撞盒（略小于 2x2 格）

function resetGame() {
  score = 0; lives = 3; level = 1;
  startLevel();
  sfx.start();
}

function startLevel() {
  buildLevel(level);
  enemies = []; bullets = []; effects = []; powerups = [];
  player.x = 4 * GRID; player.y = (ROWS - 2) * GRID;
  player.dir = 0; player.alive = true; player.cooldown = 0;
  player.respawnInvuln = 150;
  totalEnemies = 6 + level * 2;
  enemiesToSpawn = totalEnemies;
  enemiesAlive = 0;
  spawnTimer = 30;
  state = "play";
  paused = false;
  updateHUD();
}

function spawnEnemy() {
  const spots = [[0, 0], [(COLS / 2 - 1) * GRID, 0], [(COLS - 2) * GRID, 0]];
  const [sx, sy] = spots[Math.floor(Math.random() * 3)];
  // 出生点闪一下
  effects.push({ x: sx + GRID, y: sy + GRID, t: 30, type: "spawn" });
  const heavy = level >= 2 && Math.random() < 0.25;
  const fast = !heavy && Math.random() < 0.3;
  enemies.push({
    x: sx, y: sy, dir: 1, hp: heavy ? 3 : 1,
    speed: fast ? ENEMY_SPEED * 1.7 : ENEMY_SPEED,
    cool: 60, moveTimer: 0, heavy, fast,
    type: heavy ? "heavy" : fast ? "fast" : "normal",
  });
  enemiesToSpawn--;
  enemiesAlive++;
}

// ==================== 碰撞检测 ====================
function rectHitTerrain(x, y, w, h, ignoreForest = true, ignoreWater = false) {
  const x0 = Math.floor(x / (GRID / 2)), y0 = Math.floor(y / (GRID / 2));
  const x1 = Math.floor((x + w - 0.01) / (GRID / 2)), y1 = Math.floor((y + h - 0.01) / (GRID / 2));
  for (let cy = y0; cy <= y1; cy++)
    for (let cx = x0; cx <= x1; cx++) {
      const c = cellAt(cx, cy);
      if (c === BRICK || c === STEEL || c === BASE) return true;
      if (c === WATER && !ignoreWater) return true;
    }
  return false;
}

function tanksOverlap(a, b) {
  const m = 2;
  return a.x + SIZE - m > b.x + m && a.x + m < b.x + SIZE - m &&
         a.y + SIZE - m > b.y + m && a.y + m < b.y + SIZE - m;
}

// ==================== 输入 ====================
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "p" && state === "play") paused = !paused;
  if (e.key.toLowerCase() === "r") { if (state !== "menu") resetGame(); }
  if (state === "menu" && (e.key === " " || e.key === "Enter")) resetGame();
  if (state === "over" && (e.key === " " || e.key === "Enter")) resetGame();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// 移动端触屏按钮
canvas.addEventListener("touchstart", e => {
  if (state === "menu" || state === "over") { resetGame(); return; }
  const t = e.touches[0];
  handleTouch(t);
}, { passive: true });
canvas.addEventListener("touchmove", e => { handleTouch(e.touches[0]); }, { passive: true });
function handleTouch(t) {
  const r = canvas.getBoundingClientRect();
  const dx = t.clientX - (r.left + r.width / 2);
  const dy = t.clientY - (r.top + r.height / 2);
  keys["arrowup"] = keys["arrowdown"] = keys["arrowleft"] = keys["arrowright"] = false;
  if (Math.abs(dx) > Math.abs(dy)) keys[dx > 0 ? "arrowright" : "arrowleft"] = true;
  else keys[dy > 0 ? "arrowdown" : "arrowup"] = true;
  keys[" "] = true; // 触屏自动开火
}

// ==================== 玩家逻辑 ====================
function tryMove(tank, dx, dy, speed, isPlayer) {
  const nx = tank.x + dx * speed, ny = tank.y + dy * speed;
  if (!rectHitTerrain(nx, ny, SIZE, SIZE)) tank.x = nx;
  if (!rectHitTerrain(nx, ny, SIZE, SIZE)) tank.y = ny;
  // 分轴移动：先 x 后 y，手感更顺滑
  if (!rectHitTerrain(tank.x + dx * speed, tank.y, SIZE, SIZE) && dx !== 0) {
    const others = isPlayer ? enemies : [player, ...enemies.filter(e => e !== tank)];
    const test = { x: tank.x + dx * speed, y: tank.y };
    if (!others.some(o => o.alive !== false && o !== tank && tanksOverlap(test, o))) tank.x += dx * speed;
  } else if (dx !== 0 && !isPlayer) { /* 阻挡时由 AI 处理 */ }
  if (!rectHitTerrain(tank.x, tank.y + dy * speed, SIZE, SIZE) && dy !== 0) {
    const others = isPlayer ? enemies : [player, ...enemies.filter(e => e !== tank)];
    const test = { x: tank.x, y: tank.y + dy * speed };
    if (!others.some(o => o.alive !== false && o !== tank && tanksOverlap(test, o))) tank.y += dy * speed;
  }
}

function fire(tank, owner, power = 1) {
  if (tank.cooldown > 0) return;
  tank.cooldown = owner === "player" ? 18 : ENEMY_SHOOT_INTERVAL;
  const cx = tank.x + SIZE / 2, cy = tank.y + SIZE / 2;
  const [dx, dy] = DIRS[tank.dir];
  bullets.push({
    x: cx + dx * (SIZE / 2), y: cy + dy * (SIZE / 2),
    dx, dy, owner, power,
    speed: owner === "player" ? 5 : 3.2,
  });
  if (owner === "player") sfx.shoot();
}

function updatePlayer() {
  if (!player.alive) return;
  if (player.respawnInvuln > 0) player.respawnInvuln--;
  if (player.cooldown > 0) player.cooldown--;

  let moved = false;
  if (keys["arrowup"] || keys["w"])   { player.dir = 0; moved = true; }
  if (keys["arrowright"] || keys["d"]){ player.dir = 1; moved = true; }
  if (keys["arrowdown"] || keys["s"]) { player.dir = 2; moved = true; }
  if (keys["arrowleft"] || keys["a"]) { player.dir = 3; moved = true; }
  if (moved) tryMove(player, DIRS[player.dir][0], DIRS[player.dir][1], player.speed, true);
  if (keys[" "] || keys["j"]) fire(player, "player");
}

// ==================== 敌人 AI ====================
function updateEnemy(e) {
  if (e.cool > 0) e.cool--;
  e.moveTimer--;

  // 简单 AI：朝玩家或基地方向随机转向，遇到障碍换方向
  if (e.moveTimer <= 0 || blockedAhead(e)) {
    const r = Math.random();
    if (r < 0.45) {
      // 30% 朝基地方向
      const tx = (COLS - 2) * GRID, ty = (ROWS - 2) * GRID;
      const dx = tx - e.x, dy = ty - e.y;
      e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0);
    } else if (r < 0.7 && player.alive) {
      // 追玩家
      const dx = player.x - e.x, dy = player.y - e.y;
      e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0);
    } else {
      e.dir = Math.floor(Math.random() * 4);
    }
    e.moveTimer = 40 + Math.random() * 60;
  }

  tryMove(e, DIRS[e.dir][0], DIRS[e.dir][1], e.speed, false);

  // 有视线就开火
  if (e.cool <= 0 && (e.dir === 0 || e.dir === 2 ? Math.abs(player.x - e.x) < SIZE : Math.abs(player.y - e.y) < SIZE) && player.alive) {
    fire(e, "enemy");
  } else if (e.cool <= 0 && Math.random() < 0.02) {
    fire(e, "enemy");
  }
}

function blockedAhead(e) {
  const [dx, dy] = DIRS[e.dir];
  const nx = e.x + dx * e.speed, ny = e.y + dy * e.speed;
  if (rectHitTerrain(nx, ny, SIZE, SIZE)) return true;
  const others = [player, ...enemies.filter(o => o !== e)];
  return others.some(o => o.alive !== false && o !== e && tanksOverlap({ x: nx, y: ny }, o));
}

// ==================== 子弹 ====================
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.dx * b.speed;
    b.y += b.dy * b.speed;

    // 出界
    if (b.x < 0 || b.y < 0 || b.x > COLS * GRID || b.y > ROWS * GRID) {
      bullets.splice(i, 1);
      effects.push({ x: b.x, y: b.y, t: 8, type: "spark" });
      continue;
    }

    // 打中地形
    const cx = Math.floor(b.x / (GRID / 2)), cy = Math.floor(b.y / (GRID / 2));
    const c = cellAt(cx, cy);
    if (c === BRICK) {
      // 打掉命中点附近的一小块砖
      for (let oy = -1; oy <= 1; oy++)
        for (let ox = -1; ox <= 1; ox++)
          if (cellAt(cx + ox, cy + oy) === BRICK && (ox === 0 || oy === 0)) setCell(cx + ox, cy + oy, EMPTY);
      bullets.splice(i, 1);
      effects.push({ x: b.x, y: b.y, t: 12, type: "spark" });
      sfx.hitWall();
      continue;
    }
    if (c === STEEL) {
      bullets.splice(i, 1);
      effects.push({ x: b.x, y: b.y, t: 12, type: "spark" });
      sfx.steel();
      continue;
    }
    if (c === BASE) {
      bullets.splice(i, 1);
      gameOver(true);
      continue;
    }

    // 子弹互撞
    let removed = false;
    for (let j = i - 1; j >= 0; j--) {
      const o = bullets[j];
      if (o.owner !== b.owner && Math.abs(o.x - b.x) < 6 && Math.abs(o.y - b.y) < 6) {
        bullets.splice(i, 1); bullets.splice(j, 1);
        effects.push({ x: b.x, y: b.y, t: 10, type: "spark" });
        removed = true;
        break;
      }
    }
    if (removed) continue;

    if (b.owner === "player") {
      for (let k = 0; k < enemies.length; k++) {
        const e = enemies[k];
        if (b.x > e.x - 2 && b.x < e.x + SIZE + 2 && b.y > e.y - 2 && b.y < e.y + SIZE + 2) {
          e.hp -= b.power;
          bullets.splice(i, 1);
          if (e.hp <= 0) {
            enemies.splice(k, 1);
            enemiesAlive--;
            score += e.type === "heavy" ? 500 : e.type === "fast" ? 300 : 200;
            effects.push({ x: e.x + SIZE / 2, y: e.y + SIZE / 2, t: 25, type: "boom" });
            sfx.boom();
            updateHUD();
          } else {
            effects.push({ x: b.x, y: b.y, t: 8, type: "spark" });
          }
          break;
        }
      }
    } else {
      // 敌弹打玩家
      if (player.alive && player.respawnInvuln <= 0 &&
          b.x > player.x && b.x < player.x + SIZE && b.y > player.y && b.y < player.y + SIZE) {
        bullets.splice(i, 1);
        killPlayer();
      }
    }
  }
}

function killPlayer() {
  player.alive = false;
  effects.push({ x: player.x + SIZE / 2, y: player.y + SIZE / 2, t: 30, type: "boom" });
  sfx.boom();
  lives--;
  updateHUD();
  if (lives > 0) {
    setTimeout(() => {
      if (state !== "play") return;
      player.x = 4 * GRID; player.y = (ROWS - 2) * GRID;
      player.dir = 0; player.alive = true; player.respawnInvuln = 150;
    }, 1200);
  } else {
    setTimeout(() => gameOver(false), 1200);
  }
}

function gameOver(baseDestroyed) {
  if (state !== "play") return;
  state = "over";
  sfx.boom();
}

// ==================== 掉落道具 ====================
let powerupTimer = 600;
function maybeSpawnPowerup() {
  if (--powerupTimer > 0 || powerups.length > 0) return;
  powerupTimer = 900 + Math.random() * 600;
  const types = ["star", "bomb", "shield", "life"];
  powerups.push({
    x: GRID * (2 + Math.floor(Math.random() * (COLS - 4))),
    y: GRID * (2 + Math.floor(Math.random() * (ROWS - 6))),
    type: types[Math.floor(Math.random() * types.length)],
    t: 500,
  });
}

function updatePowerups() {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    if (--p.t <= 0) { powerups.splice(i, 1); continue; }
    if (player.alive &&
        p.x + GRID > player.x && p.x - GRID < player.x + SIZE &&
        p.y + GRID > player.y && p.y - GRID < player.y + SIZE) {
      powerups.splice(i, 1);
      sfx.bonus();
      if (p.type === "star") score += 300;
      else if (p.type === "bomb") {
        enemies.forEach(e => effects.push({ x: e.x + SIZE / 2, y: e.y + SIZE / 2, t: 25, type: "boom" }));
        score += enemies.length * 200;
        enemiesAlive -= enemies.length;
        enemies = [];
      }
      else if (p.type === "shield") player.respawnInvuln = 400;
      else if (p.type === "life") lives = Math.min(9, lives + 1);
      updateHUD();
    }
  }
}

// ==================== 绘制 ====================
function drawTerrain() {
  const s = GRID / 2;
  for (let y = 0; y < SUB; y++) {
    for (let x = 0; x < SUB; x++) {
      const c = cellAt(x, y);
      const px = x * s, py = y * s;
      if (c === BRICK) {
        ctx.fillStyle = "#a03a1e";
        ctx.fillRect(px, py, s, s);
        ctx.fillStyle = "#c95c34";
        ctx.fillRect(px, py, s, 3);
        ctx.fillRect(px, py + s / 2, s, 3);
        ctx.fillStyle = "#7a2812";
        ctx.fillRect(px + (y % 2 ? s / 2 : 0), py + 3, 2, s / 2 - 3);
        ctx.fillRect(px + (y % 2 ? 0 : s / 2), py + s / 2 + 3, 2, s / 2 - 3);
      } else if (c === STEEL) {
        ctx.fillStyle = "#8a8a8a";
        ctx.fillRect(px, py, s, s);
        ctx.fillStyle = "#d8d8d8";
        ctx.fillRect(px + 2, py + 2, s - 6, s - 6);
        ctx.fillStyle = "#5c5c5c";
        ctx.fillRect(px + s - 4, py + s - 4, 3, 3);
      } else if (c === WATER) {
        ctx.fillStyle = "#1a3a8a";
        ctx.fillRect(px, py, s, s);
        if ((frame >> 4) % 2 === 0) {
          ctx.fillStyle = "#3a6ad0";
          ctx.fillRect(px + 3, py + s / 2, s - 8, 2);
        } else {
          ctx.fillStyle = "#3a6ad0";
          ctx.fillRect(px + s / 2, py + 4, 2, s - 8);
        }
      } else if (c === FOREST) {
        ctx.fillStyle = "#0a5a1a";
        ctx.fillRect(px, py, s, s);
        ctx.fillStyle = "#1a8a2a";
        ctx.fillRect(px + 2, py + 2, s - 4, s - 4);
        ctx.fillStyle = "#2ab04a";
        ctx.fillRect(px + 5, py + 5, 4, 4);
      } else if (c === BASE) {
        ctx.fillStyle = "#222";
        ctx.fillRect(px, py, s, s);
      }
    }
  }
}

function drawBase() {
  const bx = (COLS - 2) * GRID, by = (ROWS - 2) * GRID;
  ctx.save();
  ctx.translate(bx + GRID, by + GRID);
  ctx.fillStyle = "#f5c518";
  ctx.shadowColor = "#f5c518";
  ctx.shadowBlur = 10;
  star5(0, 0, GRID - 3);
  ctx.fill();
  ctx.restore();
}
function star5(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    ctx[i === 0 ? "moveTo" : "lineTo"](cx + rr * Math.cos(ang), cy + rr * Math.sin(ang));
  }
  ctx.closePath();
}

function drawTank(t, isPlayer, type) {
  const { x, y, dir } = t;
  ctx.save();
  ctx.translate(x + SIZE / 2, y + SIZE / 2);
  ctx.rotate(dir * Math.PI / 2);
  const h = SIZE / 2;

  // 履带
  ctx.fillStyle = isPlayer ? "#3a5a3a" : "#5a3a3a";
  ctx.fillRect(-h, -h, 7, SIZE);
  ctx.fillRect(h - 7, -h, 7, SIZE);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  for (let i = 0; i < 5; i++) {
    const off = ((frame + i * 5) % 20) / 20 * SIZE - h;
    ctx.fillRect(-h, off, 7, 2);
    ctx.fillRect(h - 7, off, 7, 2);
  }

  // 车身
  const bodyColor = isPlayer ? "#3fae4a" : type === "heavy" ? "#c05555" : type === "fast" ? "#d09a3f" : "#b06a3a";
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-h + 7, -h + 3, SIZE - 14, SIZE - 6);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fillRect(-h + 7, -h + 3, SIZE - 14, 4);

  // 炮塔
  ctx.fillStyle = isPlayer ? "#2a7a34" : "#8a4a3a";
  ctx.beginPath();
  ctx.arc(0, 0, h - 6, 0, Math.PI * 2);
  ctx.fill();

  // 炮管
  ctx.fillStyle = "#ccc";
  ctx.fillRect(-3, -h - 4, 6, h + 2);

  ctx.restore();

  // 护盾
  if (isPlayer && player.respawnInvuln > 0) {
    ctx.strokeStyle = `rgba(120,200,255,${0.4 + 0.3 * Math.sin(frame * 0.3)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + SIZE / 2, y + SIZE / 2, SIZE * 0.75, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawBullets() {
  ctx.fillStyle = "#fff";
  for (const b of bullets) {
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  }
}

function drawEffects() {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    if (--e.t <= 0) { effects.splice(i, 1); continue; }
    const p = e.t / (e.type === "boom" ? 25 : e.type === "spawn" ? 30 : 12);
    if (e.type === "boom") {
      const r = (1 - p) * SIZE * 1.4;
      ctx.fillStyle = `rgba(255,${120 + 100 * p | 0},30,${p})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255,255,200,${p * 0.8})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "spawn") {
      ctx.strokeStyle = `rgba(255,255,255,${p})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, SIZE * (1.4 - p), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(255,255,255,${p})`;
      ctx.fillRect(e.x - 3, e.y - 3, 6, 6);
    }
  }
}

function drawPowerups() {
  for (const p of powerups) {
    if (p.t < 120 && (frame >> 3) % 2 === 0) continue; // 即将消失时闪烁
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = "#111";
    ctx.fillRect(-GRID / 2, -GRID / 2, GRID, GRID);
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(-GRID / 2, -GRID / 2, GRID, GRID);
    if (p.type === "star") { ctx.fillStyle = "#f5c518"; star5(0, 0, 9); ctx.fill(); }
    else if (p.type === "bomb") { ctx.fillStyle = "#e55"; ctx.fillRect(-6, -6, 12, 12); }
    else if (p.type === "shield") { ctx.strokeStyle = "#6cf"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.stroke(); }
    else if (p.type === "life") { ctx.fillStyle = "#3fae4a"; ctx.fillRect(-3, -8, 6, 16); ctx.fillRect(-8, -3, 16, 6); }
    ctx.restore();
  }
}

function drawOverlay(text, sub, color) {
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center";
  ctx.fillStyle = color;
  ctx.font = "bold 48px 'Microsoft YaHei', sans-serif";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 20);
  ctx.fillStyle = "#ccc";
  ctx.font = "18px 'Microsoft YaHei', sans-serif";
  ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 24);
  ctx.fillStyle = "#888";
  ctx.font = "14px 'Microsoft YaHei', sans-serif";
  ctx.fillText("按 空格 开始游戏", canvas.width / 2, canvas.height / 2 + 60);
}

// ==================== HUD ====================
function updateHUD() {
  ui.score.textContent = score;
  ui.level.textContent = level;
  ui.lives.textContent = lives;
  ui.enemies.textContent = enemiesAlive + enemiesToSpawn;
}

// ==================== 主循环 ====================
function loop() {
  frame++;

  if (state === "play" && !paused) {
    updatePlayer();
    enemies.forEach(updateEnemy);
    updateBullets();
    updatePowerups();
    maybeSpawnPowerup();
    if (spawnTimer > 0) spawnTimer--;
    else if (enemiesToSpawn > 0) { spawnEnemy(); spawnTimer = 180; }

    // 过关判定
    if (enemiesAlive === 0 && enemiesToSpawn === 0 && player.alive) {
      level++;
      score += 500;
      startLevel();
      sfx.bonus();
    }
  }

  // 绘制
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawTerrain();
  drawBase();

  if (state === "play" || state === "over") {
    drawPowerups();
    if (player.alive && state === "play") drawTank(player, true);
    enemies.forEach(e => drawTank(e, false, e.type));
    drawBullets();
  }
  drawEffects();

  if (state === "menu") drawOverlay("坦克大战", "消灭敌人 · 保卫基地", "#f5c518");
  else if (state === "over") drawOverlay("游戏结束", `最终得分 ${score} · 到达第 ${level} 关`, "#e55");

  if (paused && state === "play") {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 36px 'Microsoft YaHei', sans-serif";
    ctx.fillText("已暂停 - 按 P 继续", canvas.width / 2, canvas.height / 2);
  }

  requestAnimationFrame(loop);
}

// 菜单背景星星装饰
for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * 624, y: Math.random() * 624, r: Math.random() * 1.5 });

buildLevel(1);
updateHUD();
loop();

})();
</script>
